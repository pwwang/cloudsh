[project]
name = "cloudsh"
version = "0.3.9a1"
description = "A Python CLI wrapping common Linux commands for local/cloud files."
readme = "README.md"
license = "MIT"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.9"
dependencies = [
    "panpath>=0.4.8,<0.5",
    "argx>=0.4,<0.5",
    "python-simpleconf[toml]>=0.9,<0.10",
    "aiofiles>=23.0.0",
    "python-dateutil>=2.9.0.post0,<3",
    "argcomplete>=3.5.3,<4",
]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12,<13"]
aws = ["aioboto3>=11.0.0"]
s3 = ["aioboto3>=11.0.0"]
gs = ["gcloud-aio-storage>=9.5"]
gcs = ["gcloud-aio-storage>=9.5"]
all = ["azure-storage-blob>=12,<13", "aioboto3>=11.0.0", "gcloud-aio-storage>=9.5"]

[project.scripts]
cloudsh = "cloudsh.main:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-xdist>=3.0.0",
    "pytest-asyncio<1.3; python_version < '3.10'",
    "pytest-asyncio>=1.3,<2; python_version >= '3.10'",
    "python-dotenv>=1.0,<2",
    "gcloud-aio-storage>=9.5",
    "flake8>=7,<8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cloudsh*"]

[tool.setuptools.package-data]
cloudsh = ["args/*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-vv -n auto --dist loadgroup --cov=cloudsh --cov-report xml:.coverage.xml --cov-report term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]
console_output_style = "progress"
junit_family = "xunit1"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
